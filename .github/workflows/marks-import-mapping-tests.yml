name: CORNHILL marks import mapping tests

on:
  push:
    branches:
      - feat/offline-first-workspaces-20261109
    paths:
      - "assets/cornhill-mark-import-mapping.js"
      - "tests/marks-import-mapping.test.cjs"
      - ".github/workflows/marks-import-mapping-tests.yml"
  pull_request:
    paths:
      - "assets/cornhill-mark-import-mapping.js"
      - "tests/marks-import-mapping.test.cjs"
      - ".github/workflows/marks-import-mapping-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapping-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run marks importer mapping tests
        run: node --test tests/marks-import-mapping.test.cjs
