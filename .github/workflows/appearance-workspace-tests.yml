name: CORNHILL appearance and workspace tests

on:
  push:
    branches:
      - feat/offline-first-workspaces-20261109
    paths:
      - "assets/cornhill-appearance.js"
      - "assets/cornhill-design-system.css"
      - "index.html"
      - "banking.html"
      - "evidence.html"
      - "school-services.html"
      - "notifications.html"
      - "records.html"
      - "parents.html"
      - "admissions.html"
      - "school.html"
      - "tests/appearance-workspace.test.cjs"
      - ".github/workflows/appearance-workspace-tests.yml"
  pull_request:
    paths:
      - "assets/cornhill-appearance.js"
      - "assets/cornhill-design-system.css"
      - "index.html"
      - "banking.html"
      - "evidence.html"
      - "school-services.html"
      - "notifications.html"
      - "records.html"
      - "parents.html"
      - "admissions.html"
      - "school.html"
      - "tests/appearance-workspace.test.cjs"
      - ".github/workflows/appearance-workspace-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appearance-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run appearance and workspace tests
        run: node --test tests/appearance-workspace.test.cjs
