name: CORNHILL local backend checks

on:
  push:
    branches:
      - feat/local-first-self-hosted-migration-20261113
      - feat/full-school-integration-readiness-20261115
      - feat/cornhill-integration-batch-20261115
      - feat/cornhill-v50-annual-fee-income-groups-20261128
      - feat/cornhill-v70-register-guardian-pin-self-service-20261128
  pull_request:
    branches:
      - main
      - master
      - feat/local-first-self-hosted-migration-20261113
      - feat/cornhill-integration-batch-20261115

permissions:
  contents: read

jobs:
  local-backend:
    runs-on: ubuntu-latest
    env:
      CORNHILL_DB_HOST: 127.0.0.1
      CORNHILL_DB_PORT: "54329"
      CORNHILL_DB_ADMIN_USER: cornhill_test_admin
      CORNHILL_DB_ADMIN_PASSWORD: cornhill-ci-${{ github.run_id }}-${{ github.run_attempt }}-isolated-postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: cornhill_test_admin
          POSTGRES_PASSWORD: cornhill-ci-${{ github.run_id }}-${{ github.run_attempt }}-isolated-postgres
          TZ: Africa/Kampala
          PGTZ: Africa/Kampala
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U cornhill_test_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: local-server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install local backend dependencies
        run: npm install --no-audit --no-fund

      - name: Run release verification (source syntax and complete test suite)
        run: npm run verify:release

      - name: Verify fresh PostgreSQL 17 service and create unique empty test database
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(openssl rand -hex 16)"
          database="cornhill_isolated_test_${suffix}"
          identity="$(PGPASSWORD="$CORNHILL_DB_ADMIN_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            --host 127.0.0.1 --port 54329 --username "$CORNHILL_DB_ADMIN_USER" \
            --dbname postgres --tuples-only --no-align --field-separator='|' \
            --command "SELECT current_setting('server_version_num'), current_database(), current_setting('port'), current_setting('data_directory'), (SELECT system_identifier::text FROM pg_control_system()), (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind IN ('r','p','v','m','f','S') AND n.nspname NOT IN ('pg_catalog','information_schema') AND n.nspname NOT LIKE 'pg_toast%')")"
          IFS='|' read -r server_version maintenance_database server_port data_directory system_identifier user_object_count <<< "$identity"
          [[ "$server_version" == 17* ]] || { echo "Expected PostgreSQL 17; observed another server version."; exit 1; }
          [[ "$maintenance_database" == postgres ]] || { echo "Unexpected PostgreSQL maintenance database identity."; exit 1; }
          [[ "$server_port" == 5432 ]] || { echo "Unexpected PostgreSQL service port."; exit 1; }
          [[ "$data_directory" == /* ]] || { echo "PostgreSQL service data directory is not absolute."; exit 1; }
          [[ "$system_identifier" =~ ^[0-9]{10,20}$ ]] || { echo "PostgreSQL service system identifier is invalid."; exit 1; }
          [[ "$user_object_count" == 0 ]] || { echo "Fresh PostgreSQL service contains user objects before migrations."; exit 1; }
          PGPASSWORD="$CORNHILL_DB_ADMIN_PASSWORD" createdb \
            --host 127.0.0.1 --port 54329 --username "$CORNHILL_DB_ADMIN_USER" "$database"
          {
            printf 'CORNHILL_DB_NAME=%s\n' "$database"
            printf 'CORNHILL_DB_TARGET=isolated-test\n'
            printf 'CORNHILL_ALLOW_ISOLATED_TEST_MIGRATIONS=true\n'
            printf 'CORNHILL_DB_ISOLATED_SERVER_PORT=%s\n' "$server_port"
            printf 'CORNHILL_DB_ISOLATED_SYSTEM_IDENTIFIER=%s\n' "$system_identifier"
            printf 'CORNHILL_DB_ISOLATED_DATA_DIRECTORY=%s\n' "$data_directory"
          } >> "$GITHUB_ENV"
          echo "Verified PostgreSQL ${server_version} and created a unique empty CI-only database."

      - name: Provision CI-only authentication and finance roles
        run: node scripts/provision-local-finance-roles.mjs

      - name: Apply all isolated local migrations
        env:
          CORNHILL_ALLOW_ISOLATED_TEST_MIGRATIONS: "true"
        run: node scripts/migrate.mjs

      - name: Verify migrations are safely repeatable
        env:
          CORNHILL_ALLOW_ISOLATED_TEST_MIGRATIONS: "true"
        run: node scripts/migrate.mjs

      - name: Verify PostgreSQL tables, roles and schema permissions
        run: node scripts/verify-local-schema.mjs

      - name: Exercise PostgreSQL authentication repositories
        run: node scripts/verify-auth-repositories.mjs

      - name: Verify least-privilege authentication database role
        run: node scripts/verify-local-runtime-role.mjs

      - name: Verify learner, academic history, staff, attendance and payroll integrity
        run: node scripts/verify-local-school-schema.mjs

      - name: Rehearse learner-specific Nursery materials and Director surplus on isolated PostgreSQL 17
        run: node scripts/verify-nursery-material-movements-isolated.mjs

      - name: Verify local atomic payment workflow and finance role
        run: node scripts/verify-local-finance.mjs

      - name: Install PostgreSQL 17 backup/restore client tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          printf '\n' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          pg_dump --version
          pg_restore --version

      - name: Verify backup and restore against a second isolated database
        run: node scripts/verify-isolated-postgres-backup-restore.mjs

  windows-unit:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: local-server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install local backend dependencies
        run: npm install --no-audit --no-fund

      - name: Run release verification on Windows (source syntax and complete test suite)
        run: npm run verify:release

      - name: Parse guardian pilot installer PowerShell script without executing installation
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($file in @("scripts/install-v50-guardian-pilot.ps1", "scripts/cornhill-v53-broad-readiness.ps1", "scripts/cornhill-v54-local-academic-finance-source-review.ps1", "scripts/v62-local-materials-source-review.ps1", "scripts/v63-real-materials-workflow-source-review.ps1")) {
            $path = (Resolve-Path $file).Path
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "Guardian installer PowerShell syntax PASS; no school data modified."

      - name: Smoke-test V62 source-only collector with synthetic files on Windows
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP ("cornhill-v62-synthetic-" + [guid]::NewGuid().ToString("N"))
          $server = Join-Path $fake "local-server"
          New-Item -ItemType Directory -Path (Join-Path $server "src/db") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $server "public") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $server "migrations") -Force | Out-Null
          '{"name":"cornhill-local-server"}' | Set-Content -LiteralPath (Join-Path $server "package.json")
          'export const syntheticMaterial = true;' | Set-Content -LiteralPath (Join-Path $server "src/db/material-synthetic.mjs")
          'synthetic inventory' | Set-Content -LiteralPath (Join-Path $server "public/school.js")
          $original = Get-Content -LiteralPath (Join-Path $server "src/db/material-synthetic.mjs") -Raw
          & .\scripts\v62-local-materials-source-review.ps1 -RepoDirectory $fake
          if (-not $?) { throw "V62 synthetic source collector failed." }
          if ((Get-Content -LiteralPath (Join-Path $server "src/db/material-synthetic.mjs") -Raw) -ne $original) {
            throw "V62 changed the original source file."
          }
          Write-Host "V62 source-only collector synthetic Windows smoke test PASS."

      - name: Synthetic test V63 materials source collector on Windows
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP ("cornhill-v63-synthetic-" + [guid]::NewGuid().ToString("N"))
          $server = Join-Path $fake "local-server"
          New-Item -ItemType Directory -Path (Join-Path $server "src/security") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $server "public") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $server "migrations") -Force | Out-Null
          '{"name":"cornhill-local-server"}' | Set-Content -LiteralPath (Join-Path $server "package.json")
          'export function materialsRequest() { return true; }' | Set-Content -LiteralPath (Join-Path $server "public/school-requirements.js")
          'const x = "materialsIntake";' | Set-Content -LiteralPath (Join-Path $server "src/security/admissions-http-handler.mjs")
          'const irrelevant = "ignore";' | Set-Content -LiteralPath (Join-Path $server "public/unrelated.js")
          $original = Get-Content -LiteralPath (Join-Path $server "src/security/admissions-http-handler.mjs") -Raw
          & .\scripts\v63-real-materials-workflow-source-review.ps1 -RepoDirectory $fake
          if (-not $?) { throw "V63 synthetic source collector failed." }
          if ((Get-Content -LiteralPath (Join-Path $server "src/security/admissions-http-handler.mjs") -Raw) -ne $original) {
            throw "V63 changed original source."
          }
          $found = @(Get-ChildItem -LiteralPath (Join-Path $env:USERPROFILE "Downloads") -Filter "CORNHILL-V63-REAL-MATERIALS-WORKFLOW-*.zip")
          if ($found.Count -eq 0) { throw "V63 did not generate a source ZIP." }
          $latest = $found | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $zipEntries = [IO.Compression.ZipFile]::OpenRead($latest.FullName)
          try {
            $paths = @($zipEntries.Entries | ForEach-Object { $_.FullName })
            if (-not (@($paths | Where-Object { $_ -like "*school-requirements.js" }).Count -gt 0)) {
              throw "School Requirements module was missing from V63 source pack."
            }
            if (-not (@($paths | Where-Object { $_ -like "*admissions-http-handler.mjs" }).Count -gt 0)) {
              throw "Admission materials intake module was missing from V63 source pack."
            }
            if (@($paths | Where-Object { $_ -like "*unrelated.js" }).Count -gt 0) {
              throw "V63 collected an unrelated source module."
            }
          } finally { $zipEntries.Dispose() }
          Write-Host "V63 matched School Requirements and admissions material intake without changing files."


